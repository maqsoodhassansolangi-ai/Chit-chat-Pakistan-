<!-- messenger/messenger.html -->
<div id="messengerPage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:9999; overflow:hidden; flex-direction:column;">
    <!-- Messenger Header -->
    <div id="messengerHeader" style="display:flex; align-items:center; padding:12px 16px; background:#075E54; color:#fff; flex-shrink:0;">
        <button id="messengerBackBtn" style="background:transparent; border:none; color:#fff; font-size:24px; cursor:pointer; margin-right:12px;">←</button>
        <h3 style="flex:1; margin:0; font-size:18px;">Messenger</h3>
        <button id="messengerNewMsgBtn" style="background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;">✏️</button>
    </div>

    <!-- Messenger Body -->
    <div id="messengerBody" style="display:flex; flex:1; overflow:hidden; background:#f5f5f5;">
        <!-- Inbox -->
        <div id="messengerInbox" style="width:100%; max-width:350px; background:#fff; border-right:1px solid #ddd; overflow-y:auto; display:flex; flex-direction:column;">
            <div style="padding:12px; background:#f9f9f9; border-bottom:1px solid #eee;">
                <input type="text" id="messengerSearchInbox" placeholder="Search chats..." style="width:100%; padding:10px 14px; border-radius:20px; border:1px solid #ddd; font-size:14px; outline:none;">
            </div>
            <div id="messengerChatList" style="flex:1; overflow-y:auto;"></div>
        </div>

        <!-- Chat Area -->
        <div id="messengerChatArea" style="flex:1; display:flex; flex-direction:column; background:#fff; display:none;">
            <div id="messengerChatHeader" style="display:flex; align-items:center; padding:10px 16px; border-bottom:1px solid #eee; background:#fafafa; flex-shrink:0;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div id="messengerChatAvatar" style="width:36px; height:36px; border-radius:50%; background:#075E54; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px;">?</div>
                    <div>
                        <div id="messengerChatName" style="font-weight:600; font-size:15px;">User</div>
                        <div id="messengerChatStatus" style="font-size:12px; color:#888;">offline</div>
                    </div>
                </div>
                <div style="margin-left:auto;">
                    <button id="messengerCallBtn" style="background:transparent; border:none; font-size:20px; cursor:pointer;">📞</button>
                </div>
            </div>
            <div id="messengerMessages" style="flex:1; overflow-y:auto; padding:12px; background:#f0f2f5; display:flex; flex-direction:column;"></div>
            <div id="messengerInput" style="display:flex; align-items:center; padding:10px 12px; border-top:1px solid #eee; background:#fff; flex-shrink:0;">
                <input type="text" id="messengerMsgInput" placeholder="Type a message..." style="flex:1; padding:10px 14px; border-radius:24px; border:1px solid #ddd; font-size:14px; outline:none;">
                <button id="messengerSendBtn" style="background:#075E54; border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; margin-left:8px;">➤</button>
            </div>
        </div>
    </div>
</div>
